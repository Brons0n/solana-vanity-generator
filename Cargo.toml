[package]
name = "solana-vanity"
version = "0.1.0"
edition = "2021"

[dependencies]
ed25519-dalek = "1"
bs58 = "0.4"
rand = "0.7"
rayon = "1"
num_cpus = "1"
crossbeam-channel = "0.5"
colored = "2"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ocl = { version = "0.19", optional = true }

[features]
gpu = ["ocl"]
